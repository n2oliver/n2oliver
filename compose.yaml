services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.php

    container_name: php-api

    working_dir: /var/www/html

    ports:
      - "8000:80"

    volumes:
      - ./package.json:/var/www/html/package.json
      - ./vite.config.mjs:/var/www/html/vite.config.mjs
      - ./index.html:/var/www/html/index.html
      - ./.env.development:/var/www/html/.env.development
      - /var/www/html/node_modules

    env_file:
      - .env.development

    extra_hosts:
      - "host.docker.internal:host-gateway"

    develop:
      watch:
        - path: ./src
          target: /var/www/html/src
          action: rebuild

        - path: ./public
          target: /var/www/html/public
          action: rebuild

        - path: ./api
          target: /var/www/html/api
          action: rebuild

        - path: ./index.html
          target: /var/www/html/index.html
          action: rebuild